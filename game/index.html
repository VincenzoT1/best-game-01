<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON HORIZON: VOID ASSAULT</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #080a10;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #game {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 32px rgba(0, 243, 255, 0.15);
    background: #080a10;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
